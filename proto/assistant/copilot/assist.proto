syntax = "proto3";

package assistant.copilot.v1;

option go_package = "domour/gen/assistant/copilot;copilot";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

/**
 * AssistService: 隐式智能助手 (Implicit Copilot) 协议设计文档
 *
 * 适用场景: 写代码补全、文档续写、沉浸式文献阅读提示、绘图工具参数智能推荐、金融复盘研判等"非对话"场景。
 * 
 * 核心设计理念：
 * 
 * 1. 状态与动作解耦 (Context vs Action)
 *    - 在隐式场景中，客户端不主动下发指令，而是持续保持同步。为了节省带宽与 Token，上行走双轨制：
 *    - `ContextSync`: 宏观状态快照（例如：切换了 App、打开了某代码文件/K线图，包含附近大量上下文）。低频长文。
 *    - `UserAction`: 微观行为碎片（例如：敲击字符、点击按钮、滚动屏幕）。高频短文，服务端通过拼接上下文进行推断。
 * 
 * 2. 泛型建议的下行投递 (Three modes of Interventions)
 *    - 根据用户所处的场景，服务端主动下发不同形态的“帮助”：
 *    - `InlineCompletion`: 行内灰色虚拟文本（用于文字输入、写代码等续写型推断）。
 *    - `Insight`: 悬浮/侧边洞察（比如文档单词拼写纠错划红线，或是分析某只股票财报给出的划线提示）。
 *    - `Command`: 界面宏指令（AI决定不需要提示，直接帮你完成。例如前端收到后自动弹出创建一个日历日程的窗口）。
 *
 * 3. 闭环反馈机制 (Mandatory Feedback Loop)
 *    - 无声模式下，AI很难感知效果。任何下发给客户端的建议都带有一个全局唯一的 `suggestion_id`。
 *    - 客户端在用户做出决定后（按 Tab 接纳、无视并继续打字、只复制部分），必须上报 `Feedback`。
 *    - 形成闭环，作为大模型 RLHF (强化学习微调) 与产品商业化埋点最重要的指标。
 */
service AssistService {
  // 核心双向流：客户端持续上报上下文和行为，服务端适时下发建议和操作指令
  rpc Assist(stream AssistRequest) returns (stream AssistEvent);
}

// ==========================================
// 1. 请求结构: 客户端 -> 服务端 (持续上报)
// ==========================================
message AssistRequest {
  string req_id = 1; // 用于追踪此次上报
  
  oneof payload {
    ContextSync sync = 10;     // 1. 状态快照同步（如：切换了Tab，打开了新文件）
    UserAction action = 11;    // 2. 微小动作上报（如：敲了一个字符、点击了按钮）
    Feedback feedback = 12;    // 3. 对 AI 建议的反馈（如：采纳了补全）
  }
}

// 状态同步：告诉 AI "我现在看到了什么"
message ContextSync {
  string session_id = 1;      // 当前工作区/工程ID
  string active_app = 2;      // "vscode", "browser", "figma", "calendar"
  string active_uri = 3;      // 当前焦点的文件路径或URL
  
  // 对于文本类工作(写代码/博客)，提供光标前后的文本信息
  TextContext text_context = 4; 
  
  // 对于非文本工作(画图/看股票)，把整个DOM、画布或者当前K线数据全扔进去
  google.protobuf.Struct app_state = 5; 
}

message TextContext {
  string content_before_cursor = 1;
  string content_after_cursor = 2;
  string selected_text = 3;
}

// 微小动作：告诉 AI "我刚才干了什么"
message UserAction {
  string action_type = 1; // "keyboard.type", "mouse.click", "scroll", "focus"
  google.protobuf.Struct details = 2;  // 例如 {"key": "a"},或者{"x": 100, "y": 200}
  google.protobuf.Timestamp timestamp = 3;
}

// 反馈机制：告诉 AI "你刚才出的主意好不好"
message Feedback {
  string suggestion_id = 1; // 对应服务端下发事件的ID
  
  enum Decision {
    DECISION_UNSPECIFIED = 0;
    ACCEPTED = 1;          // 用户采纳(按Tab键)
    REJECTED = 2;          // 用户无视(继续打字)
    PARTIAL_ACCEPTED = 3;  // 用户采纳了部分(比如只取了一行代码)
  }
  Decision decision = 2;
}

// ==========================================
// 2. 响应结构: 服务端 -> 客户端 (主动推送)
// ==========================================
message AssistEvent {
  // 这次建议的全局ID，客户端用来上送 Feedback
  string suggestion_id = 1; 
  
  // 如果是响应某次特定动作(比如用户打了个字母触发的)，这里带有 req_id 关联
  string req_id = 2; 

  oneof event {
    InlineCompletion inline = 10;  // 1. 行内文本补全 (代码/打字场景)
    Insight insight = 11;          // 2. 悬浮洞察提示 (分析场景，如股票异动、报错波浪线)
    Command command = 12;          // 3. 可执行指令 (让客户端自动改UI、排日程等)
  }
}

// 行内推断（类似 GitHub Copilot 灰色字）
message InlineCompletion {
  string insert_text = 1; // 建议插入的文本
  
  // 要替换的范围(如果有的话，没有就是直接粘贴在光标处)
  int32 start_offset = 2; 
  int32 end_offset = 3;   
}

// 悬浮洞察（比如划横线、侧边小红点）
message Insight {
  enum Level {
    INFO = 0;       // 比如："这个变量名拼错了" / "这只股票市盈率过高"
    WARNING = 1;
    ERROR = 2;
  }
  Level level = 1;
  string message = 2;      // 提示内容
  string target_uri = 3;   // 指向哪个文件/网页
  
  // 附加结构化数据：前端可以用来渲染图表、折线、或者链接
  google.protobuf.Struct extended_data = 4; 
}

// 客户端宏指令 (AI 直接帮你办事)
// 比如读了日程表邮件，下发 Command，让本地 Calendar 客户端自动建会
message Command {
  string command_name = 1;  // 例如 "calendar.createEvent", "window.split"
  google.protobuf.Struct arguments = 2; // 动作需要的JSON参数
}