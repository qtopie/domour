syntax = "proto3";

package assistant.copilot.v1;

option go_package = "domour/gen/assistant/copilot;copilot";

import "google/protobuf/struct.proto";

/**
 * ChatService 设计说明文档 (AI Agent Conversation Protocol)
 *
 * 本服务定义了一个通用、简单且可扩展的多人、多 Agent 会话协议。核心设计理念如下：
 * 
 * 1. 会话与多分支 (Sessions & Conversation Branches)
 *    - `session_id`: 宏观层级的大房间（类似一个群聊），承载多实体（人/Agent）参与。
 *    - `conversation_id`: 微观层级的话题分支。允许在同一个房间内开辟并行的讨论或子任务，彼此隔离上下文。
 *
 * 2. 消息异步追踪与幂等 (Idempotency & Message Tracking)
 *    - `req_id`: 客户端生成的临时流水号。因为是双向流，用于将服务端的首次响应(Ack)跟客户端某次具体请求对应起来。
 *    - `msg_id`: 服务端全局生成的唯一消息ID。客户端拿到此ID后，可用作后续撤回、取消(Cancel)、重试的唯一凭证。
 *
 * 3. 并发双向流模型 (Bidirectional Streaming)
 *    - 客户端可以随时(无需等待上一次响应)发送多个任务(`PostMessage`)或控制指令(`Control`)。
 *    - 服务端可以在一条持续的流中交叉复用事件：比如先下发 `Ack` 确定任务分配，然后持续下发 `MessageDelta` 回传打字机效果。
 *
 * 4. 强类型业务承载 (Rich Typed Payload)
 *    - 舍弃跨语言难以处理的无约束 `map<string, object>` 结构。
 *    - 采用标准化的 `repeated Attachment` 来传输附件资源。
 *    - 采用 `google.protobuf.Struct` 承载前端UI状态或大模型语境所需的灵活 `context` (如选中代码块等)。
 *
 * 5. 增量渲染规范 (Delta Principle)
 *    - 参照业界大模型流式生成标准，使用 `content_delta` 表示增量文字片段，而不是替换整体。
 */
service ChatService {
  // 核心双向流接口：客户端可连续发消息/发指令，服务端可持续推送状态/增量结果
  rpc Chat(stream ChatRequest) returns (stream ChatEvent);
}

// ==========================================
// 1. 请求结构 (Request)
// ==========================================
message ChatRequest {
  // 客户端生成的当前 RPC 请求的临时追踪ID（如 uuid）。
  // 仅用于把服务端的回复跟这条请求对应起来。
  string req_id = 1; 

  oneof payload {
    PostMessage post_message = 10;
    Control control = 11;
  }
}

// 用户发送的消息
message PostMessage {
  string session_id = 1;       // 大会话ID（比如一个群聊房间）
  string conversation_id = 2;  // 话题/分支ID（同一个session下可以有多个并行的讨论）
  string sender_id = 3;        // 发送人身份ID
  string content = 4;          // 文本内容
  
  // 附件列表，由统一的 Attachment 结构提定义
  repeated Attachment attachments = 5; 
  
  // 强类型的键值对，存放上下文（代替 map<string, object>）
  // 比如 {"ui_state": "code_editor_open", "selected_text": "func main() {}"}
  google.protobuf.Struct context = 6;  
}

// 客户端发起的控制指令（如：取消任务）
message Control {
  enum Command {
    COMMAND_UNSPECIFIED = 0;
    CANCEL = 1;  // 取消尚未被处理或正在处理的任务
  }
  Command command = 1;
  
  // 目标消息ID（由服务端最初生成并下发的）
  string target_msg_id = 2; 
}

// 规范化的附件结构
message Attachment {
  string id = 1;           // 附件唯一ID
  string filename = 2;     // 文件名称
  string mime_type = 3;    // 例如 "image/png", "application/pdf"
  string url = 4;          // 可访问的存储地址(OSS等)
  int64 size_bytes = 5;    // 文件大小
  google.protobuf.Struct metadata = 6;  // 其他关于附件的扩展元数据
}

// ==========================================
// 2. 响应结构 (Event)
// ==========================================
message ChatEvent {
  // 对应请求的临时追踪ID，让客户端知道这是刚才哪个请求的回执
  // 注意：如果是服务端主动下发的事件（非请求触发），此字段可为空
  string req_id = 1; 

  // 全局唯一的消息ID（由服务端首次 Ack 时生成并下发）
  // 后续该消息的任何状态流转、增量文本，都带有这个 msg_id
  string msg_id = 2; 

  oneof event {
    MessageAck ack = 10;
    MessageDelta delta = 11;
    MessageCompleted completed = 12;
    Error error = 13;
  }
}

// 服务端确认接收，并正式下发全局 msg_id
message MessageAck {
  int64 created_at = 1; // 接收时间戳
}

// 消息(AI)的增量输出
message MessageDelta {
  string content_delta = 1; // 增量文本流片段
}

// 消息处理完成
message MessageCompleted {
  string final_content = 1; // 可选：返回最终拼接好的完整文本，方便客户端兜底
  
  enum FinishReason {
    REASON_UNSPECIFIED = 0;
    STOP = 1;       // 正常完成
    CANCELLED = 2;  // 被客户端取消
    ERROR = 3;      // 发生异常中止
  }
  FinishReason reason = 2;
}

// 处理中出现的错误
message Error {
  int32 code = 1;
  string message = 2;
}
