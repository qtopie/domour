syntax = "proto3";

package assistant.copilot;
option go_package = "github.com/qtopie/domour/gen/assistant/copilot";

import "assistant/common/media.proto";

service CopilotService {
  rpc Complete(CopilotRequest) returns (CopilotResponse);
  rpc Copilot(CopilotRequest) returns (stream CopilotResponse);
}

message CopilotRequest {
  string session_id = 1;
  int32 seq = 2;
  string workspace = 3;
  string message = 4;            // user prompt/context
  string code_before = 5;        // code preceding the cursor
  string code_after = 6;         // code following the cursor
  string filename = 7;
  int32 cursor_offset = 8;
  repeated assistant.common.v1.Attachment attachments = 9;
  string provider = 10;
  string model = 11;
}

message CopilotResponse {
  string session_id = 1;
  int32 seq = 2;
  string patch = 3;             // suggested code or patch
  bool complete = 4;
  map<string, string> meta = 5;
}
