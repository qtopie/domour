syntax = "proto3";

package assistant.chat;
option go_package = "github.com/qtopie/domour/gen/assistant/chat";

import "assistant/common/media.proto";

service ChatService {
  rpc Chat(ChatRequest) returns (stream ChatResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

message ListModelsRequest {
}

message ModelInfo {
  string id = 1;
  string provider = 2;
  string model_name = 3;
  repeated string tags = 4;
  repeated string user_tags = 5;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message ChatRequest {
  string session_id = 1;
  int32 seq = 2;
  string workspace = 3;
  string message = 4;
  repeated assistant.common.v1.Attachment attachments = 5;
  string provider = 6;
  string model = 7;
  EditorContext editor_context = 8;
  // system_prompt_override replaces the default system prompt entirely when set.
  // The caller (e.g. cosmos-star / cosmos-assistant) can inject channel-specific
  // instructions (multimedia formatting, etc.) without relying on gRPC metadata
  // headers, which have ASCII-only constraints.
  string system_prompt_override = 9;
}

message EditorContext {
  repeated PinnedFile pinned_files = 1;
}

message PinnedFile {
  string path = 1;
  string content = 2;
  string language = 3;
}

enum ChunkType {
  CHUNK_TEXT      = 0;  // 正文（proto3 零值/默认类型）
  CHUNK_THINKING  = 1;  // 推理过程
  CHUNK_TOOL_CALL = 2;  // 工具调用
  CHUNK_NODE_HOP  = 3;  // Agent 节点跳转（原名 COLLABORATION）
  CHUNK_MEDIA     = 4;  // 媒体（图片/视频/音频）
}

message ChatResponse {
  string session_id = 1;
  int32 message_id = 2;      // 对话轮次标识（原名 seq）
  ChunkType type = 3;
  string content = 4;

  // Structured payloads
  ThinkingDetail thinking = 5;
  CollaborationDetail collaboration = 6;
  ToolCallDetail tool_call = 7;

  // bool done = 8;         // 移除 — 由 max_seq_checksum 水位线替代
  map<string, string> meta = 9;
  int32 chunk_seq = 10;      // 消息内 chunk 递增序号
  int32 max_seq_checksum = 11; // 后端已产生的最大 chunk_seq
  MediaDetail media = 12;    // type=CHUNK_MEDIA 时有效
}

message MediaDetail {
  string url       = 1;  // 媒体 URL 或 base64 data URI
  string mime_type = 2;  // "image/png", "video/mp4", "audio/wav"
  string alt_text  = 3;  // 可访问性描述
  int64  size_bytes = 4; // 文件大小
}

message ThinkingDetail {
  string engine = 1;  // e.g., "deepseek-r1", "simple", "react"
  string stage = 2;   // e.g., "plan", "reflect", "thought"
  int64 elapsed_ms = 3;
}

message CollaborationDetail {
  string from_node = 1; // "diencephalon", "cerebrum", "cerebellum", "brainstem"
  string to_node = 2;   // "diencephalon", "cerebrum", "cerebellum", "brainstem"
  string event_type = 3; // "sensory_relay", "pons_copy", "correction_report"
  string description = 4;
}

message ToolCallDetail {
  string tool_name = 1;
  string tool_id = 2;
  string status = 3;       // "started", "completed", "failed"
  string arguments = 4;    // JSON arguments
  string observation = 5;  // Tool output (populated on completion)
  int64 duration_ms = 6;
}

